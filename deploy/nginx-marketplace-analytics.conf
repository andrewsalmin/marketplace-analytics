# На сервере стенда: /etc/nginx/sites-available/marketplace-analytics
# (симлинк из sites-enabled). Применяется `nginx -t && systemctl reload nginx`.
#
# Строки с пометкой «managed by Certbot» дописал сам certbot при выпуске
# сертификата — править их руками не нужно, при следующем продлении он
# перепишет их снова.
#
# Файл лежит вне рабочей копии проекта и выкладкой git не обновляется:
# копию здесь и оригинал на сервере надо держать в согласии руками.
# Проверить, что они не разошлись:
#
#     ssh СЕРВЕР sudo md5sum /etc/nginx/sites-available/marketplace-analytics
#     md5sum deploy/nginx-marketplace-analytics.conf

server {
    server_name marketplace-analytics.andrewsalmin.com;

    # Статика (JS/CSS/иконки)
    location /static/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
    }

    # Сам дашборд
    location = /superset/dashboard/marketplace-overview/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API, нужные для отрисовки дашборда и его чартов
    location ~ ^/api/v1/(dashboard|chart)(/|$) {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Явно закрытые пути — Explore, SQL Lab, датасеты/базы, логин, админка
    location ~ ^/(explore|sqllab|login|users|roles|tablemodelview|databaseview)(/|$) {
        return 403;
    }
    location ~ ^/api/v1/(explore|sqllab|database|dataset|saved_query|query)(/|$) {
        return 403;
    }

    # Снимки дашборда для README на GitHub. Их перезаписывает ночная
    # задача, поэтому картинка в README показывает сегодняшние данные и
    # не занимает места в репозитории.
    location /shots/ {
        alias /var/www/marketplace-shots/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Корень — редирект на дашборд
    location / {
        return 301 https://marketplace-analytics.andrewsalmin.com/superset/dashboard/marketplace-overview/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/marketplace-analytics.andrewsalmin.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/marketplace-analytics.andrewsalmin.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = marketplace-analytics.andrewsalmin.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name marketplace-analytics.andrewsalmin.com;
    return 404; # managed by Certbot


}
