name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Линтер и тесты без Spark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # --require-hashes: ставится ровно то, что записано в lock-файле.
      # Прогон CI не зависит от того, что вышло на PyPI со вчера.
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # Второй лок — ради тестов Superset: без requests они молча
      # пропускались бы, и девять проверок выдачи прав не выполнялись
      # нигде. Локи не пересекаются ни одним пакетом, ставятся подряд.
      - name: Install the Superset client dependencies
        run: pip install --require-hashes -r requirements-superset.lock

      # --no-deps: зависимости уже поставлены из lock-файла с
      # хешами, здесь нужен только сам проект — чтобы модули из
      # корня импортировались без правки sys.path.
      - name: Install the project
        run: pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      # Тесты, которым нужен pyspark (DQ-правила, маркер загрузки), здесь
      # пропускаются через pytest.importorskip и выполняются в job spark.
      - name: Run tests
        run: pytest -v

  # Весь набор, а не список файлов. Список уже отставал: тесты маркера
  # загрузки без pyspark пропускались в job test, а сюда не попадали и не
  # выполнялись нигде. Тесты генератора идут в обоих job'ах — это секунды,
  # а не повод вести список вручную. Тесты Superset здесь пропускаются
  # (requests не ставится) и выполняются в job test.
  spark:
    name: Тесты на Spark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Spark 3.5 требует JVM; на раннере она есть не всегда нужной версии.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned dependencies with Spark
        run: pip install --require-hashes -r requirements-spark.lock

      # --no-deps: зависимости уже поставлены из lock-файла с
      # хешами, здесь нужен только сам проект — чтобы модули из
      # корня импортировались без правки sys.path.
      - name: Install the project
        run: pip install -e . --no-deps

      - name: Run tests with Spark
        run: pytest -v
