[project]
name = "marketplace-analytics"
version = "3.0.0"
description = "Marketplace analytics MVP: synthetic source-system export with controlled DQ error injection, plus the raw/clean/quarantine pipeline into ClickHouse."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "faker>=20.0",
    "pyarrow>=14.0",
]

# Плоская раскладка объявлена явно, а не угадывается. Без этого проект
# не устанавливается, и импорт `import growth` из tests/ или из
# superset/ приходилось чинить через sys.path.insert — по строке на
# каждую точку входа, и по новой строке на каждую следующую.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# packages = [] обязателен: при плоской раскладке setuptools сам ищет
# пакеты и спотыкается о dags/, data/ и superset/ — «Multiple top-level
# packages discovered». Одного py-modules недостаточно, автопоиск он не
# отключает.
packages = []
py-modules = [
    "generate_data",
    "growth",
    "ingest_csv_to_raw",
    "load_to_clickhouse",
    "marts_checks",
    "transform",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip("pyspark") обязан отработать до импортов pyspark,
# поэтому импорты в этом файле не могут стоять в самом верху.
"tests/test_transform_dq.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
