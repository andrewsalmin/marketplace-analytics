[project]
name = "marketplace-analytics"
version = "3.0.0"
description = "Marketplace analytics MVP: synthetic source-system export with controlled DQ error injection, plus the raw/clean/quarantine pipeline into ClickHouse."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "faker>=20.0",
    "pyarrow>=14.0",
]

# Плоская раскладка объявлена явно, а не угадывается. Без этого проект
# не устанавливается, и импорт `import growth` из tests/ или из
# superset/ приходилось чинить через sys.path.insert — по строке на
# каждую точку входа, и по новой строке на каждую следующую.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Список пакетов задан явно: при плоской раскладке setuptools ищет их
# сам и спотыкается о dags/ и data/ — «Multiple top-level packages
# discovered». Явное перечисление заодно выключает автопоиск, чего
# одного py-modules недостаточно.
packages = ["superset"]
py-modules = [
    "generate_data",
    "growth",
    "ingest_csv_to_raw",
    "clickhouse_ddl",
    "load_to_clickhouse",
    "marts_checks",
    "transform",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
