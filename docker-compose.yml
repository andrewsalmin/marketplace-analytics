services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: analytics-clickhouse
    ports:
      - "8123:8123" # HTTP-интерфейс
      - "9000:9000" # native-протокол
    environment:
      # Без дефолта, чтобы пароль не осел в файле. Устанавливается перед
      # запуском (export/$env: CLICKHOUSE_PASSWORD) или через .env.
      # USER/DB должны совпадать с clickhouse_config.json — синхронизация вручную.
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD before starting}
      CLICKHOUSE_DB: marketplace_analytics
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
